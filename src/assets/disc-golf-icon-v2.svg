<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>

    <!-- Warm sunrise sky gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1b2e4b"/>
      <stop offset="45%"  stop-color="#2b4a6f"/>
      <stop offset="100%" stop-color="#4a7c6f"/>
    </linearGradient>

    <!-- Sunrise glow behind horizon -->
    <radialGradient id="sunGlow" cx="65%" cy="72%" r="38%">
      <stop offset="0%"   stop-color="#f97c2a" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#e85d1a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e85d1a" stop-opacity="0"/>
    </radialGradient>

    <!-- Ground gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#2d6e4a"/>
      <stop offset="100%" stop-color="#1a3d28"/>
    </linearGradient>

    <!-- Disc gradient — bright yellow-green -->
    <radialGradient id="discFill" cx="35%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#d4f576"/>
      <stop offset="55%"  stop-color="#9ed63a"/>
      <stop offset="100%" stop-color="#6bac18"/>
    </radialGradient>

    <!-- Disc rim shading -->
    <linearGradient id="discRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#b8e835"/>
      <stop offset="100%" stop-color="#5a9010"/>
    </linearGradient>

    <!-- Basket metal -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7abf96"/>
      <stop offset="50%"  stop-color="#c8e8d5"/>
      <stop offset="100%" stop-color="#6aaf86"/>
    </linearGradient>

    <!-- Soft glow filter for disc -->
    <filter id="discGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#9ed63a" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glowBlur"/>
      <feMerge>
        <feMergeNode in="glowBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle drop shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#000c05" flood-opacity="0.45"/>
    </filter>

    <!-- Glow for flight path -->
    <filter id="pathGlow">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="circleClip">
      <circle cx="120" cy="120" r="112"/>
    </clipPath>

  </defs>

  <!-- ── BACKGROUND CIRCLE ── -->
  <circle cx="120" cy="120" r="116" fill="#0f1e2e"/>
  <circle cx="120" cy="120" r="112" fill="url(#skyGrad)"/>

  <!-- Clipped content -->
  <g clip-path="url(#circleClip)">

    <!-- Sunrise atmosphere glow -->
    <ellipse cx="158" cy="170" rx="80" ry="60" fill="url(#sunGlow)"/>

    <!-- Stars (top-left quadrant) -->
    <g fill="white" opacity="0.5">
      <circle cx="32"  cy="30"  r="1"/>
      <circle cx="58"  cy="18"  r="0.8"/>
      <circle cx="80"  cy="42"  r="1.1"/>
      <circle cx="20"  cy="60"  r="0.7"/>
      <circle cx="45"  cy="55"  r="0.9"/>
      <circle cx="15"  cy="90"  r="0.8"/>
      <circle cx="100" cy="22"  r="0.7"/>
      <circle cx="130" cy="35"  r="1"/>
      <circle cx="60"  cy="75"  r="0.6"/>
    </g>

    <!-- Distant tree line silhouette -->
    <g fill="#1a3d28">
      <!-- Left trees -->
      <polygon points="10,168 22,138 34,168"/>
      <polygon points="24,168 38,130 52,168"/>
      <polygon points="42,168 54,142 66,168"/>
      <polygon points="56,168 70,148 84,168"/>
      <!-- Right trees -->
      <polygon points="155,168 168,140 181,168"/>
      <polygon points="168,168 182,132 196,168"/>
      <polygon points="184,168 198,145 212,168"/>
      <polygon points="200,168 215,138 230,168"/>
    </g>

    <!-- Ground -->
    <rect x="0" y="168" width="240" height="72" fill="url(#groundGrad)"/>

    <!-- Ground highlight strip -->
    <rect x="0" y="168" width="240" height="3" fill="#3a8a5a" opacity="0.5"/>

    <!-- ── BASKET ── -->
    <g filter="url(#softShadow)">

      <!-- Pole -->
      <rect x="149" y="120" width="6" height="66" rx="3" fill="url(#metalGrad)"/>

      <!-- Top catch ring -->
      <ellipse cx="152" cy="138" rx="24" ry="6.5"
               fill="none" stroke="url(#metalGrad)" stroke-width="3.5"/>

      <!-- Top ring highlight -->
      <ellipse cx="152" cy="136.5" rx="24" ry="4"
               fill="none" stroke="white" stroke-width="1" opacity="0.35"/>

      <!-- Chain anchor top -->
      <ellipse cx="152" cy="128" rx="12" ry="3.5"
               fill="none" stroke="#a0d4b8" stroke-width="2"/>

      <!-- Chains — left side -->
      <g stroke="#a8d8bc" stroke-width="1.2" opacity="0.9" stroke-linecap="round">
        <line x1="130" y1="138" x2="135" y2="158"/>
        <line x1="134" y1="137" x2="138" y2="158"/>
        <line x1="138" y1="136" x2="141" y2="158"/>
        <line x1="142" y1="136" x2="143" y2="158"/>
      </g>

      <!-- Chains — right side -->
      <g stroke="#a8d8bc" stroke-width="1.2" opacity="0.9" stroke-linecap="round">
        <line x1="152" y1="128" x2="152" y2="158"/>
        <line x1="156" y1="136" x2="155" y2="158"/>
        <line x1="160" y1="136" x2="158" y2="158"/>
        <line x1="164" y1="137" x2="161" y2="158"/>
        <line x1="168" y1="138" x2="164" y2="158"/>
      </g>

      <!-- Basket lower rim -->
      <ellipse cx="152" cy="158" rx="20" ry="5.5"
               fill="none" stroke="url(#metalGrad)" stroke-width="3"/>

      <!-- Basket cup -->
      <path d="M132,158 Q132,172 152,174 Q172,172 172,158"
            fill="#1a3d28" stroke="#7abf96" stroke-width="1.8"/>

      <!-- Basket cup rim detail -->
      <ellipse cx="152" cy="174" rx="20" ry="4"
               fill="none" stroke="#6aaf86" stroke-width="1.5"/>

    </g>

    <!-- ── FLIGHT PATH ── -->
    <path
      d="M 68 148 C 68 90, 110 68, 144 126"
      fill="none"
      stroke="#d4f576"
      stroke-width="1.8"
      stroke-dasharray="5 5"
      opacity="0.55"
      filter="url(#pathGlow)"
    />

    <!-- Flight path arrow tip -->
    <polygon points="144,126 138,118 148,116"
             fill="#d4f576" opacity="0.65"
             filter="url(#pathGlow)"/>

    <!-- ── DISC ── -->
    <g filter="url(#discGlow)" transform="translate(68, 148) rotate(-22)">

      <!-- Disc shadow cast on ground -->
      <ellipse cx="0" cy="18" rx="22" ry="5" fill="#000" opacity="0.18"/>

      <!-- Disc side thickness (rim) -->
      <ellipse cx="0" cy="3" rx="26" ry="8" fill="url(#discRim)"/>

      <!-- Disc top face -->
      <ellipse cx="0" cy="0" rx="26" ry="8" fill="url(#discFill)"/>

      <!-- Flight rings -->
      <ellipse cx="0" cy="0" rx="18" ry="5.5"
               fill="none" stroke="#6bac18" stroke-width="0.9" opacity="0.7"/>
      <ellipse cx="0" cy="0" rx="10" ry="3.2"
               fill="none" stroke="#6bac18" stroke-width="0.8" opacity="0.6"/>

      <!-- Center dome bump -->
      <ellipse cx="0" cy="-0.5" rx="6" ry="2.5" fill="#c8f050" opacity="0.85"/>

      <!-- Specular highlight -->
      <ellipse cx="-9" cy="-2.5" rx="5" ry="1.8"
               fill="white" opacity="0.3"
               transform="rotate(-12)"/>

    </g>

  </g>

  <!-- ── OUTER BORDER RINGS ── -->
  <circle cx="120" cy="120" r="112" fill="none" stroke="#2d6e4a" stroke-width="3.5"/>
  <circle cx="120" cy="120" r="116" fill="none" stroke="#1a3d28" stroke-width="2"/>
  <circle cx="120" cy="120" r="108" fill="none" stroke="#3a8a5a" stroke-width="0.8" opacity="0.4"/>

</svg>
